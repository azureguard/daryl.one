name: Cloudflare Workers Deployment

on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Workers
    env:
      # Only run the Cloudflare steps when credentials are configured, so the
      # build still validates on branches/forks without secrets.
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # main -> production deployment. @astrojs/cloudflare emits the worker
      # config at dist/server/wrangler.json (main + ASSETS -> dist/client).
      - name: Deploy (production)
        if: github.ref == 'refs/heads/main' && env.CF_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json

      # Any other branch -> upload a preview version (does not touch production)
      # and expose its unique preview URL.
      - name: Upload preview version
        id: preview
        if: github.ref != 'refs/heads/main' && env.CF_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --config dist/server/wrangler.json

      - name: Report preview URL
        if: github.ref != 'refs/heads/main' && env.CF_CONFIGURED == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          CMD_OUTPUT: ${{ steps.preview.outputs.command-output }}
        run: |
          url="$PREVIEW_URL"
          if [ -z "$url" ]; then
            url=$(printf '%s' "$CMD_OUTPUT" | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          fi
          {
            echo "### Cloudflare Workers preview"
            echo ""
            echo "Branch \`$GITHUB_REF_NAME\` uploaded as a preview version (production untouched)."
            if [ -n "$url" ]; then
              echo ""
              echo "**Preview URL:** $url"
            else
              echo ""
              echo "_Preview URL not parsed — see the \"Upload preview version\" step log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

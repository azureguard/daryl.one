name: Cloudflare Workers Deployment

on: [push]

# Supersede redundant runs on the same ref (e.g. rapid pushes to a branch).
# Production (main) runs are never cancelled mid-deploy; preview runs are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Workers
    env:
      # Only run the Cloudflare steps when credentials are configured, so the
      # build still validates on branches/forks without secrets.
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # main -> production deployment. @astrojs/cloudflare emits the worker
      # config at dist/server/wrangler.json (main + ASSETS -> dist/client).
      - name: Deploy (production)
        if: github.ref == 'refs/heads/main' && env.CF_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json

      # Any other branch -> upload a new VERSION of the same `cv` worker (not a
      # deployment, production untouched) and get its per-commit preview URL.
      # `--assets` is passed explicitly because `versions upload` (unlike
      # `deploy`) does not pick up assets.directory from the config file.
      - name: Upload preview version
        id: preview
        if: github.ref != 'refs/heads/main' && env.CF_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --config dist/server/wrangler.json --assets ./dist/client

      - name: Report preview URL
        if: github.ref != 'refs/heads/main' && env.CF_CONFIGURED == 'true'
        env:
          # `versions upload` does not set wrangler-action's deployment-url
          # output, so parse the preview URL out of the command output.
          CMD_OUTPUT: ${{ steps.preview.outputs.command-output }}
        run: |
          url=$(printf '%s' "$CMD_OUTPUT" | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          {
            echo "### Cloudflare Workers preview (per-commit version)"
            echo ""
            if [ -n "$url" ]; then
              echo "**Preview URL:** $url"
            else
              echo "_See the \"Upload preview version\" step log for the version preview URL._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

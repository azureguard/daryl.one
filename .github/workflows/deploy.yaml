name: Cloudflare Workers Deployment

on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Workers
    env:
      # Only run the Cloudflare steps when credentials are configured, so the
      # build still validates on branches/forks without secrets.
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # main -> production deployment. @astrojs/cloudflare emits the worker
      # config at dist/server/wrangler.json (main + ASSETS -> dist/client).
      - name: Deploy (production)
        if: github.ref == 'refs/heads/main' && env.CF_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json

      # Any other branch -> deploy to a separate `cv-preview` worker (its own
      # workers.dev URL, production untouched). Must be a full `deploy`, not
      # `versions upload`: only `deploy` uploads the static assets, so a version
      # preview URL would otherwise serve "assets have not been deployed yet".
      - name: Deploy preview
        id: preview
        if: github.ref != 'refs/heads/main' && env.CF_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --name cv-preview

      - name: Report preview URL
        if: github.ref != 'refs/heads/main' && env.CF_CONFIGURED == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          {
            echo "### Cloudflare Workers preview"
            echo ""
            echo "Branch \`$GITHUB_REF_NAME\` deployed to the \`cv-preview\` worker (production untouched)."
            if [ -n "$PREVIEW_URL" ]; then
              echo ""
              echo "**Preview URL:** $PREVIEW_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
